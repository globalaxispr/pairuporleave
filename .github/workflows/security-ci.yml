name: Security & Quality CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Secret scanner (detect-secrets / pattern gate)
        run: |
          echo "Scanning for accidental secret patterns..."
          ! git grep -E 'sk_live_[0-9a-zA-Z]{24,}|whsec_[0-9a-zA-Z]{24,}|sbp_[a-f0-9]{20,}' || exit 1
          echo "Pattern scan passed."

  lint-and-typecheck:
    name: Lint, Typecheck & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Typecheck and build
        run: npm run build
        env:
          VITE_SITE_URL: https://www.pairuporleave.com
          VITE_ENABLE_PLATFORM_SERVICE_FEE: "true"

  edge-function-tests:
    name: Webhook & Payment Idempotency Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Run Webhook Integration Test Suite
        run: deno test --no-check --node-modules-dir=auto --allow-env supabase/functions/stripe-webhook/test.ts

      - name: Run Checkout Session (tiered fee) Test Suite
        run: deno test --no-check --node-modules-dir=auto --allow-env --allow-read supabase/functions/create-checkout-session/test.ts

      - name: Run Tiered Pricing Unit + Parity Tests
        run: node scripts/test-tiered-pricing.mjs

