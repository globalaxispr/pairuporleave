<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon — SVG (vector, lightweight) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fallback PNG favicon for older browsers -->
    <link rel="icon" type="image/png" href="/logo@2x.png" sizes="any" />
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/logo@2x.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default Title & Description (overridden per-page via react-helmet-async) -->
    <title>Pair Up or Leave — Your Vote. Their Moment.</title>
    <meta name="description" content="Pair Up or Leave is a live voting competition platform. Support your favorite couples and individual candidates. 1 vote = $1 for individuals, $2 for couples. Secure Stripe checkout. No account required." />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pair Up or Leave" />
    <meta property="og:title" content="Pair Up or Leave — Your Vote. Their Moment." />
    <meta property="og:description" content="Support your favorite couples and individual candidates. $1/vote for individuals, $2/vote for couples. Secure Stripe payments. No account required." />
    <meta property="og:image" content="https://pairuporleave.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pair Up or Leave — Your Vote. Their Moment." />
    <meta property="og:url" content="https://pairuporleave.com/" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pair Up or Leave — Your Vote. Their Moment." />
    <meta name="twitter:description" content="Support your favorite couples and individual candidates. $1/vote for individuals, $2/vote for couples. Secure Stripe payments." />
    <meta name="twitter:image" content="https://pairuporleave.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Pair Up or Leave — Your Vote. Their Moment." />

    <!-- Theme color for mobile browser chrome -->
    <meta name="theme-color" content="#7A0C2E" />

    <!-- Google Fonts — Preconnect early to eliminate DNS/TLS latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
