<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Pair Up or Leave</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", "Inter", system-ui, -apple-system, sans-serif;
        background: #FFF8FA;
        color: #24131A;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .card {
        background: #FFFFFF;
        border: 1px solid #F0DCE2;
        border-radius: 24px;
        padding: 3rem 2rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 8px 40px rgba(74, 6, 28, 0.06);
      }
      .code {
        font-size: 4rem;
        font-weight: 900;
        color: #7A0C2E;
        line-height: 1;
        margin: 0 0 0.75rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 1rem;
        color: #6B6870;
        line-height: 1.6;
        margin: 0 0 1.75rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        background: linear-gradient(135deg, #E51B3E 0%, #7A0C2E 100%);
        color: #FFFFFF;
        font-weight: 800;
        font-size: 0.9375rem;
        text-decoration: none;
      }
      .btn-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0.75rem 1.5rem;
        border-radius: 12px;
        border: 1.5px solid #F0DCE2;
        background: #FFFFFF;
        color: #7A0C2E;
        font-weight: 700;
        font-size: 0.9375rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for does not exist or may have moved.</p>
      <div class="actions">
        <a href="/" class="btn-primary">Back to Home</a>
        <a href="/candidates" class="btn-outline">Browse Candidates</a>
      </div>
    </main>
  </body>
</html>
